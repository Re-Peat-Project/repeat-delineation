[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repeat-delineation"
version = "0.0.1"
description = "Sub-KHG delineation from a DTM, rivers and canals (RE-PEAT)"
requires-python = ">=3.11"
dependencies = ["repeat-common", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "rasterio>=1.3", "geopandas>=0.14",
                "shapely>=2.0", "pyyaml>=6.0", "pysheds>=0.4"]

[project.scripts]
repeat-delineate = "repeat_delineation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
